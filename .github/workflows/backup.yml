name: Database backup

# Daily logical backup of the production database to an S3-compatible bucket (R2, S3, B2).
# Keep a lifecycle rule on the bucket (for example: delete after 30 days). Managed databases with
# point-in-time recovery (Neon, Supabase, RDS) still benefit from an independent copy.
on:
  schedule: [{ cron: "30 19 * * *" }] # 02:30 in Vietnam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - name: Check configuration
        run: |
          for name in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; exit 1; fi
          done
      - name: Dump
        # The pg_dump client must be at least the server's major version.
        run: docker run --rm -e DATABASE_URL postgres:17-alpine sh -c 'pg_dump --format=custom --no-owner "$DATABASE_URL"' > english4free.dump
      - name: Check the dump can be read
        run: docker run --rm -v "$PWD:/b" postgres:17-alpine pg_restore --list /b/english4free.dump > /dev/null
      - name: Upload
        run: aws s3 cp english4free.dump "s3://$BACKUP_S3_BUCKET/db/english4free-$(date -u +%Y%m%dT%H%M%SZ).dump" --endpoint-url "$BACKUP_S3_ENDPOINT"
