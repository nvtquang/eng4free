name: Data retention

# Applies the retention policy daily (old recordings, inactive guests, expired rate-limit
# windows, old telemetry). The numbers come from the RECORDING_/GUEST_/EMPTY_GUEST_/TELEMETRY_
# RETENTION_DAYS variables of the production environment.
on:
  schedule: [{ cron: "0 20 * * *" }] # 03:00 in Vietnam
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  retention:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Apply retention
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RECORDING_RETENTION_DAYS: ${{ vars.RECORDING_RETENTION_DAYS }}
          GUEST_RETENTION_DAYS: ${{ vars.GUEST_RETENTION_DAYS }}
          EMPTY_GUEST_RETENTION_DAYS: ${{ vars.EMPTY_GUEST_RETENTION_DAYS }}
          TELEMETRY_RETENTION_DAYS: ${{ vars.TELEMETRY_RETENTION_DAYS }}
        run: |
          docker run --rm -e DATABASE_URL -e S3_ENDPOINT -e S3_BUCKET -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY \
            -e RECORDING_RETENTION_DAYS -e GUEST_RETENTION_DAYS -e EMPTY_GUEST_RETENTION_DAYS -e TELEMETRY_RETENTION_DAYS \
            ghcr.io/${{ github.repository_owner }}/english4free-tools:latest pnpm maintenance:retention -- --apply
