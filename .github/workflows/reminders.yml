name: Study reminders

# Sends due study reminder emails at the start of every hour; each learner chooses the hour.
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency: { group: reminders, cancel-in-progress: false }

jobs:
  reminders:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Send due reminders
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          docker run --rm -e DATABASE_URL -e AUTH_SECRET -e AUTH_RESEND_KEY -e AUTH_EMAIL_FROM -e APP_URL \
            ghcr.io/${{ github.repository_owner }}/english4free-tools:latest pnpm maintenance:reminders
